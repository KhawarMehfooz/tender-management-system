name: tms

services:
  app:
    container_name: tms-app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    container_name: tms-nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    container_name: tms-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tms_db}
      POSTGRES_USER: ${DB_USERNAME:-tms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tms_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  queue:
    container_name: tms-queue
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    container_name: tms-scheduler
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: